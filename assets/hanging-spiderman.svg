<svg xmlns="http://www.w3.org/2000/svg" width="200" height="330" viewBox="0 0 200 330">
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E62129"/>
      <stop offset="100%" stop-color="#B3121A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C4FD8"/>
      <stop offset="100%" stop-color="#12329C"/>
    </linearGradient>
  </defs>

  <style>
    .swing { transform-origin: 100px 0px; animation: swing 4s ease-in-out infinite; }
    @keyframes swing {
      0%   { transform: rotate(-6deg); }
      50%  { transform: rotate(6deg); }
      100% { transform: rotate(-6deg); }
    }
    .arm { animation: armwig 1.8s ease-in-out infinite alternate; transform-origin: 100px 160px; }
    @keyframes armwig { from { transform: rotate(-3deg);} to { transform: rotate(3deg);} }
  </style>

  <g class="swing">
    <!-- Web thread (short) -->
    <line x1="100" y1="0" x2="100" y2="55" stroke="#ffffff" stroke-width="2"/>

    <!-- Hand gripping web -->
    <ellipse cx="100" cy="60" rx="9" ry="7" fill="url(#suit)"/>

    <!-- Legs up (holding thread) -->
    <path d="M100 62 C 90 90, 88 120, 92 150" stroke="url(#blue)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M100 62 C 110 90, 112 120, 108 150" stroke="url(#blue)" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- Torso -->
    <path d="M80 150 Q100 140 120 150 L116 220 Q100 235 84 220 Z" fill="url(#suit)"/>
    <path d="M80 150 Q100 140 120 150 L118 175 Q100 167 82 175 Z" fill="url(#blue)" opacity="0.85"/>

    <!-- Arms hanging down -->
    <g class="arm">
      <path d="M86 175 C 70 200, 66 235, 72 265" stroke="url(#suit)" stroke-width="13" fill="none" stroke-linecap="round"/>
      <path d="M114 175 C 130 200, 134 235, 128 265" stroke="url(#suit)" stroke-width="13" fill="none" stroke-linecap="round"/>
      <circle cx="72" cy="269" r="8" fill="url(#blue)"/>
      <circle cx="128" cy="269" r="8" fill="url(#blue)"/>
    </g>

    <!-- Head (upside down) -->
    <ellipse cx="100" cy="235" rx="26" ry="30" fill="url(#suit)"/>

    <!-- Eyes -->
    <path d="M84 235 Q92 223 100 233 Q92 241 84 235 Z" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <path d="M116 235 Q108 223 100 233 Q108 241 116 235 Z" fill="#ffffff" stroke="#111" stroke-width="1.5"/>

    <!-- Web pattern on head -->
    <g stroke="#111" stroke-width="0.9" fill="none" opacity="0.55">
      <path d="M100 207 V265"/>
      <path d="M78 220 Q100 235 122 220"/>
      <path d="M76 235 Q100 247 124 235"/>
      <path d="M80 251 Q100 241 120 251"/>
    </g>

    <!-- Spider logo on chest -->
    <g transform="translate(100,185)" fill="#111">
      <circle r="3"/>
      <path d="M0 -3 L-2 -10 M0 -3 L2 -10 M0 3 L-2 10 M0 3 L2 10 M-3 0 L-10 -2 M-3 0 L-10 2 M3 0 L10 -2 M3 0 L10 2" stroke="#111" stroke-width="1.4"/>
    </g>
  </g>
</svg>
