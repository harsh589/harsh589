<svg xmlns="http://www.w3.org/2000/svg" width="200" height="420" viewBox="0 0 200 420">
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E62129"/>
      <stop offset="100%" stop-color="#B3121A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C4FD8"/>
      <stop offset="100%" stop-color="#12329C"/>
    </linearGradient>
  </defs>

  <style>
    .swing { transform-origin: 100px 0px; animation: swing 4s ease-in-out infinite; }
    @keyframes swing {
      0%   { transform: rotate(-6deg); }
      50%  { transform: rotate(6deg); }
      100% { transform: rotate(-6deg); }
    }
    .arm { animation: armwig 1.8s ease-in-out infinite alternate; transform-origin: 100px 250px; }
    @keyframes armwig { from { transform: rotate(-3deg);} to { transform: rotate(3deg);} }
  </style>

  <g class="swing">
    <!-- Web thread -->
    <line x1="100" y1="0" x2="100" y2="120" stroke="#ffffff" stroke-width="2"/>

    <!-- Hand gripping web -->
    <ellipse cx="100" cy="126" rx="9" ry="7" fill="url(#suit)"/>

    <!-- Upside-down Spider-Man body -->
    <!-- Legs up (holding thread) -->
    <path d="M100 130 C 90 155, 88 185, 92 215" stroke="url(#blue)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M100 130 C 110 155, 112 185, 108 215" stroke="url(#blue)" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- Torso -->
    <path d="M80 215 Q100 205 120 215 L116 285 Q100 300 84 285 Z" fill="url(#suit)"/>
    <!-- Blue side panels -->
    <path d="M80 215 Q100 205 120 215 L118 240 Q100 232 82 240 Z" fill="url(#blue)" opacity="0.85"/>

    <!-- Arms hanging down -->
    <g class="arm">
      <path d="M86 240 C 70 265, 66 300, 72 330" stroke="url(#suit)" stroke-width="13" fill="none" stroke-linecap="round"/>
      <path d="M114 240 C 130 265, 134 300, 128 330" stroke="url(#suit)" stroke-width="13" fill="none" stroke-linecap="round"/>
      <circle cx="72" cy="334" r="8" fill="url(#blue)"/>
      <circle cx="128" cy="334" r="8" fill="url(#blue)"/>
    </g>

    <!-- Head (upside down) -->
    <ellipse cx="100" cy="300" rx="26" ry="30" fill="url(#suit)"/>

    <!-- Eyes (white with black outline) -->
    <path d="M84 300 Q92 288 100 298 Q92 306 84 300 Z" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <path d="M116 300 Q108 288 100 298 Q108 306 116 300 Z" fill="#ffffff" stroke="#111" stroke-width="1.5"/>

    <!-- Web pattern on head -->
    <g stroke="#111" stroke-width="0.9" fill="none" opacity="0.55">
      <path d="M100 272 V330"/>
      <path d="M78 285 Q100 300 122 285"/>
      <path d="M76 300 Q100 312 124 300"/>
      <path d="M80 316 Q100 306 120 316"/>
    </g>

    <!-- Spider logo on chest -->
    <g transform="translate(100,250)" fill="#111">
      <circle r="3"/>
      <path d="M0 -3 L-2 -10 M0 -3 L2 -10 M0 3 L-2 10 M0 3 L2 10 M-3 0 L-10 -2 M-3 0 L-10 2 M3 0 L10 -2 M3 0 L10 2" stroke="#111" stroke-width="1.4"/>
    </g>
  </g>
</svg>
